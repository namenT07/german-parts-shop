<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="altTitle" aria-describedby="altDesc">
  <title id="altTitle">Alternator</title>
  <desc id="altDesc">Automotive alternator with pulley and cooling fins illustration</desc>
  <defs>
    <linearGradient id="altGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="altShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- housing -->
  <path d="M64 70 Q 64 52 90 52 Q 116 52 116 70 L 116 130 Q 116 148 90 148 Q 64 148 64 130 Z" fill="url(#altGrad)" stroke="#1e293b" stroke-width="2.5" filter="url(#altShadow)"/>
  <!-- pulley -->
  <circle cx="90" cy="52" r="18" fill="#334155" stroke="#1e293b" stroke-width="2"/>
  <circle cx="90" cy="52" r="8" fill="#1e293b"/>
  <g fill="none" stroke="#94a3b8" stroke-width="1.5" opacity="0.7">
    <circle cx="90" cy="52" r="12"/>
    <circle cx="90" cy="52" r="6"/>
  </g>
  <!-- cooling fins -->
  <g stroke="#cbd5e1" stroke-width="2" stroke-linecap="round">
    <line x1="72" y1="86" x2="72" y2="132"/>
    <line x1="108" y1="86" x2="108" y2="132"/>
    <line x1="86" y1="142" x2="94" y2="142"/>
  </g>
  <!-- terminals -->
  <rect x="52" y="96" width="10" height="12" rx="2" fill="#dc2626"/>
  <rect x="138" y="96" width="10" height="12" rx="2" fill="#94a3b8"/>
  <circle cx="100" cy="160" r="5" fill="#475568" stroke="#64748b" stroke-width="1.5"/>
</svg>
