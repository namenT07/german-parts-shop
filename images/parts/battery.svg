<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="batTitle" aria-describedby="batDesc">
  <title id="batTitle">Car battery</title>
  <desc id="batDesc">Automotive 12V battery with terminals illustration</desc>
  <defs>
    <linearGradient id="batGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="batShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- case -->
  <rect x="56" y="74" width="88" height="86" rx="10" fill="url(#batGrad)" stroke="#1e293b" stroke-width="2.5" filter="url(#batShadow)"/>
  <rect x="62" y="80" width="76" height="10" rx="4" fill="#475568"/>
  <!-- label stripe -->
  <rect x="62" y="100" width="76" height="14" rx="4" fill="#334155" opacity="0.5"/>
  <!-- terminals -->
  <rect x="62" y="62" width="20" height="16" rx="3" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="118" y="62" width="20" height="16" rx="3" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="72" y="70" r="3" fill="#1e293b"/>
  <circle cx="128" y="70" r="3" fill="#1e293b"/>
  <path d="M80 142 Q 100 134 120 142" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
</svg>
