<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="rotorTitle" aria-describedby="rotorDesc">
  <title id="rotorTitle">Ventilated brake rotor</title>
  <desc id="rotorDesc">Automotive ventilated brake disc illustration</desc>
  <defs>
    <radialGradient id="rotorGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="60%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </radialGradient>
    <linearGradient id="rotorRim" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <filter id="rotorShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- inner vanes (ventilated) -->
  <g fill="#475568" opacity="0.55">
    <path d="M90 30 Q 100 28 110 30 L 112 40 Q 102 38 92 40 Z"/>
    <path d="M120 50 Q 130 55 140 50 L 150 52 Q 142 62 132 60 Z"/>
    <path d="M145 85 Q 142 95 145 105 L 155 108 Q 158 98 156 88 Z"/>
    <path d="M140 135 Q 130 140 140 145 L 150 152 Q 148 162 142 155 Z"/>
    <path d="M100 160 Q 90 160 90 170 L 82 170 Q 84 160 92 160 Z"/>
    <path d="M65 145 Q 55 140 65 135 L 55 125 Q 57 115 63 120 Z"/>
    <path d="M45 105 Q 40 95 45 85 L 55 80 Q 55 90 50 100 Z"/>
    <path d="M55 55 Q 60 45 55 35 L 45 33 Q 42 43 48 50 Z"/>
  </g>
  <!-- outer disc -->
  <circle cx="100" cy="92" r="56" fill="url(#rotorGrad)" stroke="#1e293b" stroke-width="2" filter="url(#rotorShadow)"/>
  <circle cx="100" cy="92" r="50" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>
  <!-- red rim highlight -->
  <circle cx="100" cy="92" r="56" fill="none" stroke="url(#rotorRim)" stroke-width="3" opacity="0.7"/>
  <!-- mounting holes -->
  <g fill="#1e293b">
    <circle cx="100" cy="44" r="4"/>
    <circle cx="152" cy="76" r="4"/>
    <circle cx="100" cy="140" r="4"/>
    <circle cx="48" cy="76" r="4"/>
    <circle cx="100" cy="92" r="9" fill="#334155"/>
  </g>
</svg>
