<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="coilTitle" aria-describedby="coilDesc">
  <title id="coilTitle">Coilover suspension</title>
  <desc id="coilDesc">Automotive coilover shock with spring illustration</desc>
  <defs>
    <linearGradient id="coilGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="coilShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- spring -->
  <path d="M90 60 Q 94 70 100 70 Q 106 62 110 72 Q 94 72 90 62 Z" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
  <path d="M90 72 Q 94 82 100 82 Q 106 74 110 84 Q 94 84 90 74 Z" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
  <path d="M90 84 Q 94 94 100 94 Q 106 86 110 96 Q 94 96 90 86 Z" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
  <path d="M90 96 Q 94 106 100 106 Q 106 98 110 108 Q 94 108 90 98 Z" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
  <path d="M90 108 Q 94 118 100 118 Q 106 110 110 120 Q 94 120 90 110 Z" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
  <!-- damper body -->
  <path d="M84 56 Q 84 44 100 44 Q 116 44 116 56 L 116 122 Q 116 134 100 134 Q 84 134 84 122 Z" fill="url(#coilGrad)" stroke="#1e293b" stroke-width="2.5" filter="url(#coilShadow)"/>
  <!-- mounts -->
  <g fill="#1e293b">
    <ellipse cx="100" cy="44" rx="13" ry="7"/>
    <ellipse cx="100" cy="134" rx="13" ry="7"/>
  </g>
  <line x1="100" y1="56" x2="100" y2="44" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="122" x2="100" y2="134" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  <rect x="78" y="80" width="44" height="5" rx="2" fill="#475568"/>
</svg>
