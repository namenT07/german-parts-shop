<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="armTitle" aria-describedby="armDesc">
  <title id="armTitle">Control arm</title>
  <desc id="armDesc">Automotive suspension upper control arm illustration</desc>
  <defs>
    <linearGradient id="armGrad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="armShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- triangular arm -->
  <path d="M60 40 Q 30 40 30 70 Q 30 100 60 100 L 140 40 Q 170 40 170 70 Q 170 100 140 100 Z" fill="url(#armGrad)" stroke="#1e293b" stroke-width="3" filter="url(#armShadow)"/>
  <path d="M60 100 L 140 40" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <!-- bushings -->
  <g fill="#dc2626">
    <circle cx="60" cy="100" r="7"/>
    <circle cx="140" cy="40" r="7"/>
    <circle cx="30" cy="70" r="6"/>
    <circle cx="170" cy="70" r="6"/>
  </g>
  <circle cx="100" cy="70" r="5" fill="#475568"/>
  <path d="M100 63 L 100 77 M93 70 L 107 70" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
</svg>
