  <path d="M104 90 L 126 90 Q 142 90 146 106 Q 150 122 136 122 Q 122 122 104 122" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  <path d="M104 90 L 104 70 Q 104 54 90 54 Q 76 54 72 70 Q 68 86 82 86 Q 96 86 104 86 Z" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  <rect x="150" y="138" width="26" height="16" rx="4" fill="#1e293b"/>
  <circle cx="100" cy="156" r="5" fill="#475568" stroke="#64748b" stroke-width="1.5"/>
</svg>
