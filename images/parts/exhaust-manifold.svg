<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="exhTitle" aria-describedby="exhDesc">
  <title id="exhTitle">Exhaust manifold</title>
  <desc id="exhDesc">Automotive exhaust header manifold illustration</desc>
  <defs>
    <linearGradient id="exhGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475568"/>
    </linearGradient>
    <filter id="exhShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- collector -->
  <path d="M130 90 Q 150 90 166 110 Q 174 130 156 144 Q 136 144 120 130 Q 104 116 104 90 Z" fill="url(#exhGrad)" stroke="#1e293b" stroke-width="2.5" filter="url(#exhShadow)"/>
