<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="filterTitle" aria-describedby="filterDesc">
  <title id="filterTitle">Oil filter cartridge</title>
  <desc id="filterDesc">Automotive spin-on oil filter illustration</desc>
  <defs>
    <linearGradient id="filtGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="filtShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- canister -->
  <path d="M70 70 Q 70 46 100 46 Q 130 46 130 70 L 130 150 Q 130 170 100 170 Q 70 170 70 150 Z" fill="url(#filtGrad)" stroke="#334155" stroke-width="2" filter="url(#filtShadow)"/>
  <!-- top plate -->
  <rect x="62" y="62" width="76" height="12" rx="3" fill="#475568" stroke="#1e293b" stroke-width="1.5"/>
  <!-- bottom seal -->
  <rect x="72" y="158" width="56" height="8" rx="2" fill="#1e293b"/>
  <!-- pleats -->
  <g fill="none" stroke="#94a3b8" stroke-width="1.2" opacity="0.7">
    <path d="M74 76 Q 76 110 74 144"/>
    <path d="M84 76 Q 86 110 84 144"/>
    <path d="M94 76 Q 96 110 94 144"/>
    <path d="M104 76 Q 106 110 104 144"/>
    <path d="M114 76 Q 116 110 114 144"/>
    <path d="M124 76 Q 126 110 124 144"/>
  </g>
  <circle cx="100" cy="108" r="4" fill="#dc2626"/>
  <circle cx="100" cy="108" r="1.5" fill="#ffffff"/>
</svg>
