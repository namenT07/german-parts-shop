<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="resTitle" aria-describedby="resDesc">
  <title id="resTitle">Blower motor resistor</title>
  <desc id="resDesc">Automotive electrical resistor module illustration</desc>
  <defs>
    <linearGradient id="resGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="resShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- body -->
  <rect x="68" y="74" width="64" height="52" rx="8" fill="url(#resGrad)" stroke="#1e293b" stroke-width="2.5" filter="url(#resShadow)"/>
  <!-- resistive coils -->
  <g fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round">
    <path d="M78 90 Q 84 98 90 90 Q 96 82 102 90 Q 108 98 114 90"/>
    <path d="M78 100 Q 84 108 90 100 Q 96 92 102 100 Q 108 108 114 100"/>
    <path d="M78 110 Q 84 118 90 110 Q 96 102 102 110 Q 108 118 114 110"/>
  </g>
  <!-- terminals -->
  <path d="M64 92 L 74 92 L 72 100 L 62 100 Z" fill="#94a3b8"/>
  <path d="M136 92 L 126 92 L 128 100 L 138 100 Z" fill="#94a3b8"/>
  <circle cx="100" cy="136" r="5" fill="#475568" stroke="#64748b" stroke-width="1.5"/>
</svg>
