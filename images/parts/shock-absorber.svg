<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="shockTitle" aria-describedby="shockDesc">
  <title id="shockTitle">Gas shock absorber</title>
  <desc id="shockDesc">Automotive monotube shock absorber illustration</desc>
  <defs>
    <linearGradient id="shockGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="60%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="shockShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- eye mounts -->
  <g fill="#1e293b">
    <ellipse cx="100" cy="44" rx="12" ry="7"/>
    <ellipse cx="100" cy="160" rx="12" ry="7"/>
  </g>
  <path d="M88 50 Q 100 52 112 50 L 112 110 Q 100 112 88 110 Z" fill="url(#shockGrad)" stroke="#334155" stroke-width="2" filter="url(#shockShadow)"/>
  <path d="M88 110 Q 100 112 112 110 L 112 154 Q 100 156 88 154 Z" fill="url(#shockGrad)" stroke="#334155" stroke-width="2" filter="url(#shockShadow)"/>
  <!-- piston rod -->
  <line x1="100" y1="50" x2="100" y2="44" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="154" x2="100" y2="160" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  <!-- body bands -->
  <rect x="82" y="74" width="36" height="4" fill="#dc2626" rx="2"/>
  <rect x="82" y="138" width="36" height="4" fill="#dc2626" rx="2"/>
  <circle cx="100" cy="92" r="6" fill="#475568" stroke="#64748b" stroke-width="1.5"/>
</svg>
