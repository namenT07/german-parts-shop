<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="plugTitle" aria-describedby="plugDesc">
  <title id="plugTitle">Iridium spark plug</title>
  <desc id="plugDesc">Automotive spark plug illustration</desc>
  <defs>
    <linearGradient id="plugGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="40%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="plugShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- terminal nut -->
  <rect x="86" y="34" width="28" height="16" rx="4" fill="#64748b" stroke="#334155" stroke-width="1.5" filter="url(#plugShadow)"/>
  <rect x="92" y="38" width="16" height="8" fill="#cbd5e1"/>
  <!-- ceramic insulator -->
  <path d="M96 50 L 104 50 Q 106 60 104 92 L 96 92 Q 94 60 96 50 Z" fill="url(#plugGrad)" stroke="#334155" stroke-width="1.5" filter="url(#plugShadow)"/>
  <path d="M92 54 Q 96 48 100 54 Q 104 48 108 54" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <!-- metal shell -->
  <path d="M90 92 Q 94 100 100 100 Q 106 100 110 92 L 110 130 Q 106 138 100 138 Q 94 138 90 130 Z" fill="#475568" stroke="#1e293b" stroke-width="1.5" filter="url(#plugShadow)"/>
  <rect x="96" y="100" width="8" height="6" fill="#64748b"/>
  <rect x="90" y="116" width="20" height="4" fill="#334155"/>
  <!-- ground electrode -->
  <path d="M100 98 L 114 94 L 112 86 L 106 88 Z" fill="#94a3b8" stroke="#64748b" stroke-width="1"/>
  <!-- center electrode & spark -->
  <line x1="100" y1="98" x2="100" y2="82" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M100 78 L 104 74 L 102 76 L 106 72 L 104 74 L 108 70 L 106 74 L 100 80 Z" fill="#fbbf24"/>
</svg>
