<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="chainTitle" aria-describedby="chainDesc">
  <title id="chainTitle">Timing chain kit</title>
  <desc id="chainDesc">Automotive timing chain with sprockets illustration</desc>
  <defs>
    <linearGradient id="chainGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="chainShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- sprockets -->
  <circle cx="70" cy="100" r="20" fill="none" stroke="url(#chainGrad)" stroke-width="5" filter="url(#chainShadow)"/>
  <circle cx="70" cy="100" r="8" fill="#334155"/>
  <circle cx="130" cy="100" r="24" fill="none" stroke="url(#chainGrad)" stroke-width="5" filter="url(#chainShadow)"/>
  <circle cx="130" cy="100" r="10" fill="#334155"/>
  <!-- chain -->
  <g fill="#475568" stroke="#334155" stroke-width="1.5">
    <circle cx="86" cy="84" r="4.5"/>
    <circle cx="100" cy="76" r="4.5"/>
    <circle cx="114" cy="84" r="4.5"/>
    <circle cx="120" cy="100" r="4.5"/>
    <circle cx="114" cy="116" r="4.5"/>
    <circle cx="100" cy="124" r="4.5"/>
    <circle cx="86" cy="116" r="4.5"/>
    <circle cx="80" cy="100" r="4.5"/>
  </g>
  <path d="M70 80 Q 90 72 110 80 Q 130 88 130 100 Q 130 112 110 120 Q 90 128 70 120 Q 50 112 50 100 Q 50 88 70 80 Z" fill="none" stroke="#94a3b8" stroke-width="2" opacity="0.5"/>
  <rect x="64" y="160" width="72" height="12" rx="4" fill="#dc2626"/>
  <circle cx="100" cy="166" r="4" fill="#1e293b"/>
</svg>
